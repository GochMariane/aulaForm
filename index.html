<!DOCTYPE html>
<html lang="pt-BR">

    <meta charset="UTF-8">

<body>
    <h2>Formularios Aula 10-11</h2>

    <form>
        <label for="nomeCompleto">Nome completo:</label>
        <input type="text" id="nomeCompleto" placeholder="Ex: Cassia Maria" required></input>
        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="mariacassia@gmail.com" required></input>

        <p>
            <label for="senha">Senha: </label>
            <input type="password" id="senha" required>
        </p>

        <button type="submit">Cadastrar</button>
    </form>
    
</body>
